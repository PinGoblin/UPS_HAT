name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: tests (CPython ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported interpreter: standard library only, no test packages.
          - {python: "3.8", os: ubuntu-22.04, tools: false}
          - {python: "3.10", os: ubuntu-latest, tools: true}
          - {python: "3.12", os: ubuntu-latest, tools: true}
          - {python: "3.13", os: ubuntu-latest, tools: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (unittest, standard library only)
        if: ${{ !matrix.tools }}
        run: python -W error -m unittest discover -s tests -v
      - name: Install test tools (pytest, coverage, hypothesis)
        if: ${{ matrix.tools }}
        run: pip install -r requirements-test.txt
      - name: Unit, scenario and property tests with branch coverage
        if: ${{ matrix.tools }}
        run: |
          python -m coverage run -m pytest
          python -m coverage report
      - name: Coverage summary
        if: ${{ matrix.tools && matrix.python == '3.12' }}
        run: |
          echo "## Test coverage (CPython ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.tools && matrix.python == '3.12' }}
        with:
          name: coverage-html
          path: htmlcov

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Type stubs match the code
        run: |
          pip install mypy
          python3 -m mypy.stubtest ups_hat --allowlist stubtest_allowlist.txt
          python3 -m mypy ups_hat examples/pi_status.py examples/pi_daemon.py
      - name: Fault code page is up to date
        run: python3 tools/gen_faults_md.py --check
      - name: Versions and MicroPython file list agree
        run: python3 tools/check_packaging.py

  micropython:
    runs-on: ubuntu-latest
    env:
      MP_VERSION: v1.25.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache the MicroPython build
        id: mpcache
        uses: actions/cache@v4
        with:
          path: mp
          key: micropython-${{ env.MP_VERSION }}-unix-v3
      - name: Build MicroPython (unix port and mpy-cross)
        if: steps.mpcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libffi-dev pkg-config
          git clone --depth 1 --branch "$MP_VERSION" https://github.com/micropython/micropython.git mp
          make -C mp/mpy-cross -j4 CFLAGS_EXTRA=-Wno-error
          make -C mp/ports/unix submodules
          make -C mp/ports/unix -j4 CFLAGS_EXTRA=-Wno-error
      - name: Build a 32-bit MicroPython too (closer to RP2040 / ESP32)
        if: steps.mpcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo apt-get install -y gcc-multilib
          make -C mp/ports/unix -j4 MICROPY_FORCE_32BIT=1 MICROPY_PY_FFI=0 BUILD=build-32 CFLAGS_EXTRA=-Wno-error
      - name: Simulator tests under MicroPython
        run: mp/ports/unix/build-standard/micropython tests/scenarios.py
      - name: Compile to .mpy
        run: tools/build_mpy.sh mp/mpy-cross/build/mpy-cross
      - name: Measure RAM use
        run: |
          {
            echo "## ups_hat RAM use (MicroPython $MP_VERSION, unix port)"
            echo ""
            echo "| Build | Files | After import (bytes) | Running, after polls (bytes) | Smallest heap that works (KB) |"
            echo "|---|---|---|---|---|"
            for MP in mp/ports/unix/build-standard/micropython mp/ports/unix/build-32/micropython; do
              [ -x "$MP" ] || continue
              bits=$(case "$MP" in *build-32*) echo 32-bit;; *) echo 64-bit;; esac)
              for d in . build/mpy; do
                name=$([ "$d" = . ] && echo ".py source" || echo ".mpy compiled")
                r=$($MP tools/mp_mem.py "$d")
                imp=$(echo "$r" | awk '/import_bytes/{print $2}')
                run=$(echo "$r" | awk '/running_bytes/{print $2}')
                heap=$(tools/mp_heap.sh $MP "$d")
                echo "| $bits | $name | $imp | $run | $heap |"
              done
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ups_hat-mpy
          path: dist/*.zip

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Build documentation (warnings are errors)
        run: mkdocs build --strict

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, checks, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Publish to the gh-pages branch
        run: mkdocs gh-deploy --force
