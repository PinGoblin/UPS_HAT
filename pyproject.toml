[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ups-hat"
version = "1.4.0"
description = "UPS HAT+ for Raspberry Pi: charger, USB-C PD and battery monitoring library (CPython and MicroPython)"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}

[project.scripts]
ups-hat = "ups_hat.cli:main"

[tool.setuptools]
packages = ["ups_hat"]

[tool.setuptools.package-data]
ups_hat = ["py.typed", "*.pyi"]

[project.optional-dependencies]
test = ["pytest>=7", "coverage[toml]>=7.2", "hypothesis>=6"]

# ---- tests: python -m pytest  (or, with no extra packages: python -m unittest discover -s tests)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ups_hat"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']
